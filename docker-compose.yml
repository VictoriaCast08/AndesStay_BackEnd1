version: '3.8'

networks:
  andesstay-net:
    driver: bridge

services:
  # --- 1. BFF GATEWAY (Puerto 8080) ---
  bff-service:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: bff-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: azure
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCE: ${AZURE_AUDIENCE}
      ANDESSTAY_CORS_ORIGINS: ${ANDESSTAY_CORS_ORIGINS:-http://localhost:4200}
      RESERVATIONS_SERVICE_URL: ${RESERVATIONS_SERVICE_URL:-http://ms-andesstay-reservations:8083}
      CATALOG_SERVICE_URL: http://ms-andesstay-catalog:8082
      REPORT_SERVICE_URL: http://ms-andesstay-report:8085
      AUDIT_SERVICE_URL: http://ms-andesstay-audit:8086
    networks:
      - andesstay-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # --- 2. MICROSERVICIO CATALOG (Puerto 8082) ---
  ms-andesstay-catalog:
    build:
      context: ./ms-andesstay-catalog
      dockerfile: Dockerfile
    container_name: ms-andesstay-catalog
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: azure
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCE: ${AZURE_AUDIENCE}
    networks:
      - andesstay-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # --- 3. MICROSERVICIO RESERVATIONS (Puerto 8083 - Productor Eventos + Postgres RDS) ---
  ms-andesstay-reservations:
    build:
      context: ./ms-andesstay-reservations
      dockerfile: Dockerfile
    container_name: ms-andesstay-reservations
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: azure
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCE: ${AZURE_AUDIENCE}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # Apunta al RabbitMQ en la EC2 #2 (Notify)
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST_NOTIFY_EC2}
      SPRING_RABBITMQ_PORT: 5672
    networks:
      - andesstay-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # --- 4. MICROSERVICIO REPORT (Puerto 8085) ---
  ms-andesstay-report:
    build:
      context: ./ms-andesstay-report
      dockerfile: Dockerfile
    container_name: ms-andesstay-report
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: azure
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCE: ${AZURE_AUDIENCE}
    networks:
      - andesstay-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # --- 5. MICROSERVICIO AUDIT (Puerto 8086) ---
  ms-andesstay-audit:
    build:
      context: ./ms-andesstay-audit
      dockerfile: Dockerfile
    container_name: ms-andesstay-audit
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: azure
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCE: ${AZURE_AUDIENCE}
    networks:
      - andesstay-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped