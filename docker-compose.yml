version: '3.8'

networks:
  andesstay-net:
    driver: bridge

services:
  # --- 1. BFF GATEWAY (Puerto 8080) ---
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: andesstay-bff
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EC2_BACKEND_IP: ${EC2_BACKEND_IP}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AWS_API_GATEWAY_URL: ${AWS_API_GATEWAY_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      RESERVATIONS_SERVICE_URL: http://reservations:8082
      CATALOG_SERVICE_URL: http://catalog:8081
      REPORT_SERVICE_URL: http://report:8085
      AUDIT_SERVICE_URL: http://audit:8084
    networks:
      - andesstay-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # --- 2. MICROSERVICIO CATALOG (Puerto 8081) ---
  catalog:
    build:
      context: ./ms-andesstay-catalog
      dockerfile: Dockerfile
    container_name: andesstay-catalog
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EC2_BACKEND_IP: ${EC2_BACKEND_IP}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AWS_DB_HOST: ${AWS_DB_HOST}
      AWS_DB_PORT: ${AWS_DB_PORT}
      AWS_DB_NAME: ${AWS_DB_NAME}
      AWS_DB_USER: ${AWS_DB_USER}
      AWS_DB_PASS: ${AWS_DB_PASS}
    networks:
      - andesstay-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # --- 3. MICROSERVICIO RESERVATIONS (Puerto 8082 - Productor Eventos + Postgres RDS) ---
  reservations:
    build:
      context: ./ms-andesstay-reservations
      dockerfile: Dockerfile
    container_name: andesstay-reservations
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EC2_BACKEND_IP: ${EC2_BACKEND_IP}
      EC2_RABBITMQ_IP: ${EC2_RABBITMQ_IP}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AWS_DB_HOST: ${AWS_DB_HOST}
      AWS_DB_PORT: ${AWS_DB_PORT}
      AWS_DB_NAME: ${AWS_DB_NAME}
      AWS_DB_USER: ${AWS_DB_USER}
      AWS_DB_PASS: ${AWS_DB_PASS}
    networks:
      - andesstay-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # --- 4. MICROSERVICIO NOTIFY (Puerto 8083 - Consumidor RabbitMQ en Instancia B) ---
  notify:
    build:
      context: ./ms-andesstay-notify
      dockerfile: Dockerfile
    container_name: andesstay-notify
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EC2_BACKEND_IP: ${EC2_BACKEND_IP}
      EC2_RABBITMQ_IP: ${EC2_RABBITMQ_IP}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    networks:
      - andesstay-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # --- 5. MICROSERVICIO AUDIT (Puerto 8084) ---
  audit:
    build:
      context: ./ms-andesstay-audit
      dockerfile: Dockerfile
    container_name: andesstay-audit
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EC2_BACKEND_IP: ${EC2_BACKEND_IP}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AWS_DB_HOST: ${AWS_DB_HOST}
      AWS_DB_PORT: ${AWS_DB_PORT}
      AWS_DB_NAME: ${AWS_DB_NAME}
      AWS_DB_USER: ${AWS_DB_USER}
      AWS_DB_PASS: ${AWS_DB_PASS}
    networks:
      - andesstay-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # --- 6. MICROSERVICIO REPORT (Puerto 8085) ---
  report:
    build:
      context: ./ms-andesstay-report
      dockerfile: Dockerfile
    container_name: andesstay-report
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EC2_BACKEND_IP: ${EC2_BACKEND_IP}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AWS_DB_HOST: ${AWS_DB_HOST}
      AWS_DB_PORT: ${AWS_DB_PORT}
      AWS_DB_NAME: ${AWS_DB_NAME}
      AWS_DB_USER: ${AWS_DB_USER}
      AWS_DB_PASS: ${AWS_DB_PASS}
    networks:
      - andesstay-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
