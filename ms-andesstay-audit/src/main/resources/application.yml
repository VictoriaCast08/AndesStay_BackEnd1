spring:
  application:
    name: ms-andesstay-audit
  profiles:
    default: azure
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${AWS_DB_HOST}:${AWS_DB_PORT}/${AWS_DB_NAME}
    username: ${AWS_DB_USER}
    password: ${AWS_DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

andesstay:
  azure:
    audience: ${AZURE_CLIENT_ID}
    tenant-id: ${AZURE_TENANT_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

---
spring:
  config:
    activate:
      on-profile: azure
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys

---
spring:
  config:
    activate:
      on-profile: local

andesstay:
  azure:
    audience: local
    tenant-id: local
  cors:
    allowed-origins: http://localhost:4200,http://localhost:5173