spring:
  application:
    name: ms-andesstay-bff
  profiles:
    default: azure
  config:
    import: optional:file:.env[.properties]

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

andesstay:
  azure:
    issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/35442bb9-6147-4555-8ac7-7aea33ca4c73/v2.0}
    audience: ${AZURE_AUDIENCE:api://6a84e40b-9b22-40e4-b05a-16b64df43827}
  cors:
    allowed-origins: ${ANDESSTAY_CORS_ORIGINS:http://127.0.0.1:4200,http://localhost:4200,http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: azure
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/35442bb9-6147-4555-8ac7-7aea33ca4c73/v2.0}

---
spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:http://localhost/unused}

andesstay:
  azure:
    issuer-uri: http://localhost/unused
    audience: local