spring:
  application:
    name: ms-andesstay-bff
  profiles:
    default: azure
  config:
    import: optional:file:${ENV_FILE:.env.andesstay}[.properties]

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

andesstay:
  azure:
    audience: ${AZURE_AUDIENCE:api://andesstay-api}
  cors:
    allowed-origins: ${ANDESSTAY_CORS_ORIGINS:http://127.0.0.1:4200,http://localhost:4200,http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: azure
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/v2.0}

---
spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:http://localhost/unused}

andesstay:
  azure:
    audience: local
