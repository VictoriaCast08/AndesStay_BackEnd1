spring:
  application:
    name: ms-andesstay-bff
  profiles:
    default: azure
  config:
    import: optional:file:.env[.properties]

server:
  port: 8080
  # Permite que Spring Boot reconozca el contexto y protocolo enviado por AWS API Gateway
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

andesstay:
  azure:
    audience: ${AZURE_CLIENT_ID}
    tenant-id: ${AZURE_TENANT_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  services:
    catalog-url: ${CATALOG_SERVICE_URL:http://catalog:8081}
    reservations-url: ${RESERVATIONS_SERVICE_URL:http://reservations:8082}
    notify-url: ${NOTIFY_SERVICE_URL:http://notify:8083}
    audit-url: ${AUDIT_SERVICE_URL:http://audit:8084}
    report-url: ${REPORT_SERVICE_URL:http://report:8085}

---
spring:
  config:
    activate:
      on-profile: azure
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys

---
spring:
  config:
    activate:
      on-profile: local

andesstay:
  azure:
    audience: local
    tenant-id: local
  cors:
    allowed-origins: http://localhost:4200,http://localhost:5173
  services:
    catalog-url: http://catalog:8081
    reservations-url: http://reservations:8082
    notify-url: http://notify:8083
    audit-url: http://audit:8084
    report-url: http://report:8085