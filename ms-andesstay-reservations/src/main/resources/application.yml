spring:
  application:
    name: ms-andesstay-reservations
  profiles:
    default: azure
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${AWS_DB_HOST}:${AWS_DB_PORT}/${AWS_DB_NAME}
    username: ${AWS_DB_USER}
    password: ${AWS_DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # RabbitMQ - Conexión a Instancia B externa (Productor de eventos)
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:34.194.82.57:5672,34.194.82.57:5673}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3

  # Kafka - Productor de eventos analíticos y de auditoría (clúster 3 brokers)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP:andesstay-reservations-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "*"

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

andesstay:
  azure:
    audience: ${AZURE_CLIENT_ID}
    tenant-id: ${AZURE_TENANT_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  rabbitmq:
    exchanges:
      cmd: ex.andesstay.cmd
      topic: amq.topic
      dlx: ex.andesstay.dlx
    queues:
      email: q.cmd.email
      email-dlq: q.cmd.email.dlq
      tickets: q.cmd.tickets
      tickets-dlq: q.cmd.tickets.dlq
      documents: q.cmd.documents
      documents-dlq: q.cmd.documents.dlq
      reservations: q.event.reservations
      reservations-dlq: q.event.reservations.dlq
    routing-keys:
      email: q.cmd.email
      tickets: q.cmd.tickets
      documents: q.cmd.documents
      email-dlq: q.cmd.email.dlq
      tickets-dlq: q.cmd.tickets.dlq
      documents-dlq: q.cmd.documents.dlq
      reservations: reservation.#
      reservations-dlq: q.event.reservations.dlq
      reservation-created: reservation.created
      reservation-updated: reservation.updated

---
spring:
  config:
    activate:
      on-profile: azure
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys

